<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up and Login</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <!-- Back Button -->
        <button id="back-button" class="back-button" onclick="window.location.href='index.html';">Back</button>

        <!-- Sign Up Form -->
        <form id="signup-form" class="auth-form">
            <h2>Sign Up</h2>
            <label for="signup-email">Email</label>
            <input id="signup-email" name="email" type="email" placeholder="Email" required>
            
            <label for="signup-password">Password</label>
            <input id="signup-password" name="password" type="password" placeholder="Password" required>
            
            <button type="submit">Sign Up</button>
            <p>Already have an account? <a href="#" id="show-login">Login</a></p>
        </form>

        <!-- Login Form -->
        <form id="login-form" class="auth-form" style="display:none;">
            <h2>Login</h2>
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" placeholder="Email" required>
            
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" placeholder="Password" required>
            
            <button type="submit">Login</button>
            <p>Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
        </form>
    </div>
    <script src="auth.js" type="module"></script>
</body>
</html>
