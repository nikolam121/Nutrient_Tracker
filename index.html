<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edamam API Search</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <button id="login-signup" onclick="window.location.href='auth.html';">Login / Sign Up</button>
    <button type="button" id="signout-btn" style="display:none;">Sign Out</button>

    <form id="search-form">
        <input type="text" id="search-input" placeholder="Enter food item..." autocomplete="off">
        <input type="number" id="gram-input" placeholder="Enter amount in grams..." min="1">
        <button type="submit">Add Food</button>
    </form>
    
    <ul id="autocomplete-list" class="autocomplete-items"></ul>
    
    <div id="food-list">
        <h3>Selected Foods</h3>
        <ul id="selected-foods"></ul>
        <div id="nutrient-summary">
            <p>Total Calories: <span id="total-calories">0</span> kcal</p>
            <p>Total Protein: <span id="total-protein">0</span> g</p>
            <p>Total Fat: <span id="total-fat">0</span> g</p>
            <p>Total Carbohydrates: <span id="total-carbs">0</span> g</p>
        </div>
    </div>
    
    <div id="results"></div>

    <script src="auth.js" type="module"></script> 
    <script src="main.js" type="module"></script>
</body>
</html>
